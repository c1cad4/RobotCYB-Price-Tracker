<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon48">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="eyeGradient48" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00cc33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="48" height="48" fill="#000000"/>
  
  <!-- Внешний овал с белым свечением -->
  <ellipse cx="24" cy="24" rx="18" ry="12" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.9" opacity="0.7"/>
  
  <!-- Внутренний вихрь (темные цвета) -->
  <ellipse cx="24" cy="24" rx="15" ry="10.5" fill="url(#eyeGradient48)" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 24 24;360 24 24" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Центральный зеленый свет -->
  <circle cx="24" cy="24" r="6" fill="url(#eyeGradient48)" filter="url(#neon48)">
    <animate attributeName="r" values="6;6.6;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Белая точка в центре -->
  <circle cx="24" cy="24" r="1.5" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Дополнительное свечение -->
  <ellipse cx="24" cy="24" rx="21" ry="15" fill="none" stroke="#00ff41" stroke-width="0.6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg> 