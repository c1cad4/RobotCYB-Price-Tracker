<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon16-pink">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="eyeGradient16-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cc0066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="16" height="16" fill="#000000"/>
  
  <!-- Внешний овал с белым свечением -->
  <ellipse cx="8" cy="8" rx="6" ry="4" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.3" opacity="0.7"/>
  
  <!-- Внутренний вихрь (темные цвета) -->
  <ellipse cx="8" cy="8" rx="5" ry="3.5" fill="url(#eyeGradient16-pink)" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 8 8;360 8 8" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Центральный розовый свет -->
  <circle cx="8" cy="8" r="2" fill="url(#eyeGradient16-pink)" filter="url(#neon16-pink)">
    <animate attributeName="r" values="2;2.2;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Белая точка в центре -->
  <circle cx="8" cy="8" r="0.5" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Дополнительное свечение -->
  <ellipse cx="8" cy="8" rx="7" ry="5" fill="none" stroke="#ff0080" stroke-width="0.2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg> 