<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon32">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="eyeGradient32" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00cc33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Внешний овал с белым свечением -->
  <ellipse cx="16" cy="16" rx="12" ry="8" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.6" opacity="0.7"/>
  
  <!-- Внутренний вихрь (темные цвета) -->
  <ellipse cx="16" cy="16" rx="10" ry="7" fill="url(#eyeGradient32)" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Центральный зеленый свет -->
  <circle cx="16" cy="16" r="4" fill="url(#eyeGradient32)" filter="url(#neon32)">
    <animate attributeName="r" values="4;4.4;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Белая точка в центре -->
  <circle cx="16" cy="16" r="1" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Дополнительное свечение -->
  <ellipse cx="16" cy="16" rx="14" ry="10" fill="none" stroke="#00ff41" stroke-width="0.4" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg> 